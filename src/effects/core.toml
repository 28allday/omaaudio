# The Effects menu's core set: the everyday effects listed at the top of the
# menu, by group, in this order. Everything else installed is under
# Effects > All Effects and in Add Effect…
#
# Each name is an effect family: the plugin's name without its channel variant
# (Mono, Stereo, LeftRight, MidSide, "(Mono)", "(Stereo)"). The menu adds the
# stereo version and offers Left/Right and Mid/Side beside it where the plugin
# has them. Families that are not installed are left out, so this list names
# more than any one machine needs.
#
# Groups: dynamics, eq, reverb, delay, modulation, distortion, space,
# restoration, pitch, meters, utility, other.

